[package]
name = "savesgg-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3 = "1.8.7"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
globset = "0.4.21"
keyvalues-parser = "0.2.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
ureq = "3.5.2"
walkdir = "2.5.0"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
sysinfo = "0.40"
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Foundation"] }
winreg = "0.56.0"
