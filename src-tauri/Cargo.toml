[package]
name = "savesgg"
version = "0.2.0"
description = "Backup contínuo de saves de jogos"
authors = ["thelipesousa"]
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "savesgg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
savesgg-core = { path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", features = ["serde"] }
tauri-plugin-dialog = "2"
ureq = "3"
sysinfo = "0.40.4"
notify = "8.2.2"
dirs = "7.0.0"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2.10.2"
log = "0.4.35"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }


