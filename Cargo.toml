[workspace]
resolver = "3"
members = ["crates/core", "src-tauri"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# O cache de compilação passava de 15 GB e enchia o disco: depuração completa só
# no nosso código (com tabelas de linha), nada nas dependências.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
